name: Disposable Hunting Time media transfer

on:
  push:
    branches:
      - research/hunting-time-media-transfer-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out disposable branch
        uses: actions/checkout@v4

      - name: Download the twelve public clue images and official BIP39 wordlist
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p hunting-time-media
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HL_pzFfWIAAZ-sl.jpg?format=jpg&name=orig' -o hunting-time-media/clue-01.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HMjsVnIXIAErtZa.jpg?format=jpg&name=orig' -o hunting-time-media/clue-02.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HNB1zr_XYAAFE5N.jpg?format=jpg&name=orig' -o hunting-time-media/clue-03.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HNry7JoWMAAWa7k.jpg?format=jpg&name=orig' -o hunting-time-media/clue-04.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HOPt1B2WkAAPFca.jpg?format=jpg&name=orig' -o hunting-time-media/clue-05.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HOaK9QsWUAACSoS.jpg?format=jpg&name=orig' -o hunting-time-media/clue-06.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HOoHoo5WwAEwo7W.jpg?format=jpg&name=orig' -o hunting-time-media/clue-07.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HOz3TvBWQAAL-X-.jpg?format=jpg&name=orig' -o hunting-time-media/clue-08.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HPDzzLjWQAAf5cZ.jpg?format=jpg&name=orig' -o hunting-time-media/clue-09.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HPSsyANXMAA553S.jpg?format=jpg&name=orig' -o hunting-time-media/clue-10.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HPeSOYwXwAAk2Wk.jpg?format=jpg&name=orig' -o hunting-time-media/clue-11.jpg
          curl -L --fail --retry 4 'https://pbs.twimg.com/media/HPlSoVUWgAAr50E.jpg?format=jpg&name=orig' -o hunting-time-media/clue-12.jpg
          curl -L --fail --retry 4 'https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt' -o hunting-time-media/bip39-english.txt
          test "$(wc -l < hunting-time-media/bip39-english.txt)" -eq 2048
          sha256sum hunting-time-media/* | tee hunting-time-media/SHA256SUMS.txt

      - name: Create a labelled contact sheet
        shell: bash
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          root = Path('hunting-time-media')
          files = [root / f'clue-{i:02d}.jpg' for i in range(1, 13)]
          cell_w, cell_h = 640, 460
          sheet = Image.new('RGB', (cell_w * 3, cell_h * 4), 'white')
          draw = ImageDraw.Draw(sheet)
          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 34)
          except OSError:
              font = ImageFont.load_default()
          for i, path in enumerate(files, 1):
              image = ImageOps.exif_transpose(Image.open(path)).convert('RGB')
              image.thumbnail((cell_w - 24, cell_h - 72), Image.Resampling.LANCZOS)
              col, row = (i - 1) % 3, (i - 1) // 3
              x0, y0 = col * cell_w, row * cell_h
              draw.rectangle((x0, y0, x0 + cell_w - 1, y0 + cell_h - 1), outline='black', width=2)
              draw.text((x0 + 12, y0 + 8), f'CLUE {i}', fill='black', font=font)
              sheet.paste(image, (x0 + (cell_w - image.width) // 2, y0 + 58 + (cell_h - 62 - image.height) // 2))
          sheet.save(root / 'contact-sheet.jpg', quality=92, optimize=True)
          PY

      - name: Upload one-day research artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-public-clue-media-and-wordlist
          path: hunting-time-media
          retention-days: 1
          if-no-files-found: error
